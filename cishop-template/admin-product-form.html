    <main role="main" class="container">
      <div class="row">
        <div class="col-md-10 mx-auto">
          <div class="card">
            <div class="card-header">Formulir Produk</div>
            <div class="card-body">
              <form action="">
                <div class="mb-3">
                  <label for="title" class="form-label">Produk</label>
                  <input
                    type="text"
                    class="form-control"
                    id="title"
                    onkeyup="createSlug()"
                    autofocus
                    required
                  />
                  <small class="text-danger">Produk Harus Diisi.</small>
                </div>
                <div class="mb-3">
                  <label for="slug" class="form-label">Slug</label>
                  <input type="text" class="form-control" id="slug" required />
                  <small class="text-danger">Slug Harus Diisi.</small>
                </div>
                <div class="mb-3">
                  <label for="price" class="form-label">Harga</label>
                  <input
                    type="number"
                    class="form-control"
                    id="price"
                    required
                  />
                  <small class="text-danger">Harga Harus Diisi.</small>
                </div>
                <div class="mb-3">
                  <label for="category" class="form-label">Kategori</label>
                  <select name="category" id="category" class="form-select">
                    <option value="">-- Pilih Kategori --</option>
                    <option value="1">Elektronik</option>
                    <option value="2">Fashion</option>
                  </select>
                  <small class="text-danger">Kategori Harus Dipilih.</small>
                </div>
                <div class="mb-3">
                  <label for="" class="form-label">Stock</label>
                  <br />
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="stock"
                      id="stockIn"
                      value="tersedia"
                      checked
                    />
                    <label class="form-check-label" for="stockIn"
                      >Tersedia</label
                    >
                  </div>
                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="stock"
                      id="stockOut"
                      value="kosong"
                    />
                    <label class="form-check-label" for="stockOut"
                      >Kosong</label
                    >
                  </div>
                </div>
                <div class="mb-3">
                  <label for="image" class="form-label">Gambar</label>
                  <input type="file" class="form-control" id="image" />
                </div>
              </form>
            </div>
            <div class="card-footer text-end">
              <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="assets/libs/jquery/jquery-4.0.0.min.js"></script>
