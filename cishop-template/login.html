            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                  id="dropdown-1"

                <ul class="dropdown-menu" aria-labelledby="dropdown-1">

                    <a class="dropdown-item" href="/admin-category.html"

                  <li>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item">

              </li>
              <li class="nav-item">

              </li>
              <li class="nav-item">

    <main role="main" class="container">
      <div class="row">
        <div class="co-md-8" mx-auto>
          <div class="card">
            <div class="card-header h5">Login</div>
            <div class="card-body">
              <form action="">
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input
                    id="email"
                    type="email"
                    class="form-control"
                    required
                    autofocus
                  />
                  <small class="form-text text-danger">Email Harus Diisi</small>
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input
                    id="password"
                    type="password"
                    class="form-control"
                    required
                    autofocus
                  />
                  <small class="form-text text-danger"
                    >Password Harus Diisi</small
                  >
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="assets/libs/jquery/jquery-4.0.0.min.js"></script>
