  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary mb-3">
        <div class="container-fluid container-lg">
          <a class="navbar-brand h1" href="index.html">CIShop</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html"
                  >Home</a
                >
              </li>
              <li class="nav-item dropdown">
                <a
                  id="dropdown-1"
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-haspopup="true"
                  aria-expanded="false"
                >
                  Manage
                </a>
                <ul class="dropdown-menu" aria-labelledby="dropdown-1">
                  <li>
                    <a class="dropdown-item" href="/admin-category.html"
                      >Kategori</a
                    >
                  </li>
                  <li>
                    <a class="dropdown-item" href="/admin-product.html"
                      >Produk</a
                    >
                  </li>
                  <li>
                    <a class="dropdown-item" href="/admin-order.html">Order</a>
                  </li>
                </ul>
              </li>
            </ul>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a href="/cart.html" class="nav-link"
                  ><i class="fas fa-shopping-cart"></i> Cart (0)</a
                >
              </li>
              <li class="nav-item">
                <a href="/login.html" class="nav-link">Login</a>
              </li>
              <li class="nav-item">
                <a href="/register.html" class="nav-link">Register</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  id="dropdown-2"
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-haspopup="true"
                  aria-expanded="false"
                >
                  Admin
                </a>
                <ul class="dropdown-menu" aria-labelledby="dropdown-2">
                  <li>
                    <a class="dropdown-item" href="/profile.html">Profile</a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="/orders.html">Orders</a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="#">Logout</a>
                  </li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main role="main" class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="card mb-3">
            <div class="card-header">Cart</div>
            <div class="card-body">
              <table class="table table-hover table-striped align-middle">
                <thead>
                  <tr>
                    <th>Produk</th>
                    <th class="text-center">Harga</th>
                    <th class="text-center">Jumlah</th>
                    <th class="text-center">Subtotal</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      <p>
                        <img src="https://placehold.co/50x50" alt="" />
                        <strong>Produk Title</strong>
                      </p>
                    </td>
                    <td class="text-center">Rp100.000</td>
                    <td>
                      <form action="">
                        <div class="input-group">
                          <input
                            type="number"
                            class="form-control text-center"
                            value="1"
                          />
                          <button type="submit" class="btn btn-info text-white">
                            <i class="fa-solid fa-check"></i>
                          </button>
                        </div>
                      </form>
                    </td>
                    <td class="text-center">Rp100.000</td>
                    <td>
                      <form action="">
                        <button type="submit" class="btn btn-danger">
                          <i class="fa-solid fa-trash"></i>
                        </button>
                      </form>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="3"><strong>Total:</strong></td>
                    <td class="text-center"><strong>Rp100.000</strong></td>
                    <td></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="card-footer">
              <a href="/checkout.html" class="btn btn-success float-end"
                >Pembayaran <i class="fa-solid fa-angle-right"></i
              ></a>
              <a href="/index.html" class="btn btn-warning text-white"
                ><i class="fa-solid fa-angle-left"></i> Kembali Belanja</a
              >
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="assets/libs/jquery/jquery-4.0.0.min.js"></script>
    <script src="/assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
